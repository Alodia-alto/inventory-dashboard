<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Inventory Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Product Inventory Dashboard</h1>
    </header>

    <section class="controls">
      <input
        type="text"
        id="searchInput"
        placeholder="Enter product name"
      />

      <select id="categoryFilter">
        <option value="All">All</option>
        <option value="Accessories">Accessories</option>
        <option value="Displays">Displays</option>
        <option value="Storage">Storage</option>
        <option value="Components">Components</option>
      </select>

      <button id="searchBtn">Search</button>
      <button id="resetBtn">Reset</button>
    </section>

    <section class="summary">
      <div class="summary-card">
        <span class="summary-label">Total Inventory Value</span>
        <span class="summary-value" id="totalInventoryValue">₱0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Low-Stock Products</span>
        <span class="summary-value" id="lowStockCount">0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Out-of-Stock Products</span>
        <span class="summary-value" id="outOfStockCount">0</span>
      </div>
    </section>

    <p id="noResultsMessage" class="no-results" style="display: none;">
      No products found
    </p>

    <main id="productList" class="product-list">
      <!-- Product cards are rendered here by display.js -->
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
